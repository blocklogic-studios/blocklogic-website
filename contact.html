<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Blocklogic Studio</title>
  <meta name="description" content="Contact Blocklogic Studio for addon support, collabs, or press." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://blocklogic.studio/contact.html" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" width="36" height="36" alt="" />
        Blocklogic Studio
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/addons.html">Addons</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/donate.html">Donate</a></li>
        <li><a href="/contact.html" aria-current="page">Contact</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>Contact</h1>
        <p class="lead">Bugs, ideas, collabs — reach us through GitHub or email.</p>
      </div>
    </section>
    <section>
      <div class="wrap" style="max-width:560px">
        <div class="card" style="margin-bottom:1.5rem">
          <h3>GitHub</h3>
          <p>Issues and discussions on our org repos.</p>
          <p style="margin-top:0.75rem">
            <a href="https://github.com/blocklogic-studios" rel="noopener noreferrer">github.com/blocklogic-studios</a>
          </p>
        </div>
        <div class="card" style="margin-bottom:1.5rem">
          <h3>Email</h3>
          <p><a href="mailto:hello@blocklogic.studio">hello@blocklogic.studio</a></p>
        </div>
        <form action="mailto:hello@blocklogic.studio" method="post" enctype="text/plain">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <button class="btn btn-primary" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <strong style="color:var(--text)">Blocklogic Studio</strong>
      </div>
      <div class="socials">
        <a href="https://github.com/blocklogic-studios" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
